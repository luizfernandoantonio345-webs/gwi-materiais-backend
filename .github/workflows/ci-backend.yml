name: CI Backend

on:
  push:
    branches: [main, develop]
    paths: ["gwi_v2/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    paths: ["gwi_v2/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: gwi_v2

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test-sqlite:
    name: Testes (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest + cobertura (gate 70%)
        run: python -m pytest -v --cov --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: gwi_v2/coverage.xml
          if-no-files-found: ignore

  test-postgres:
    name: Testes (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gwi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest contra Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gwi_test
        run: python -m pytest -v

  migrations:
    name: Migrações Alembic (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gwi_mig
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gwi_mig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: upgrade head
        run: python -m alembic upgrade head
      - name: downgrade base
        run: python -m alembic downgrade base
      - name: upgrade head (novamente)
        run: python -m alembic upgrade head

  security:
    name: Segurança (SAST + dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install bandit pip-audit
      - name: bandit (falha em média+)
        run: bandit -r app -x app/seed.py --severity-level medium
      - name: pip-audit
        run: pip-audit -r requirements.txt

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: [lint, test-sqlite]
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t gwi-materiais-api:${{ github.sha }} .
