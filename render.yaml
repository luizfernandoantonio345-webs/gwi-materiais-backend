services:
  - type: web
    name: gwi-materiais-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./gwi_v2.db
      - key: CORS_ORIGINS
        value: '["https://gwi-frontend.vercel.app"]'
